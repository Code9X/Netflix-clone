- name: Login to ECR Public
  community.docker.docker_login:
    registry_url: public.ecr.aws
    username: AWS
    password: "{{ lookup('env', 'AWS_ECR_PUBLIC_TOKEN') }}"
  tags: netflix_app

- name: Pull netflix-backend image
  community.docker.docker_image:
    name: "{{ netflix_backend_image }}"
    source: pull
  register: backend_image_pull_result
  tags: netflix_app

- name: Run netflix-backend container
  community.docker.docker_container:
    name: netflix-backend
    image: "{{ netflix_backend_image }}"
    state: started
    restart_policy: always
    recreate: yes
    ports:
      - "{{ netflix_backend_port_host }}:{{ netflix_backend_port_container }}"
    env: "{{ netflix_backend_env }}"
  tags: netflix_app

- name: Pull netflix-frontend image
  community.docker.docker_image:
    name: "{{ netflix_frontend_image }}"
    source: pull
  tags: netflix_app

- name: Run netflix-frontend container
  community.docker.docker_container:
    name: netflix-frontend
    image: "{{ netflix_frontend_image }}"
    state: started
    restart_policy: always
    recreate: yes
    ports:
      - "{{ netflix_frontend_port_host }}:{{ netflix_frontend_port_container }}"
    env: "{{ netflix_frontend_env }}"
  tags: netflix_app

- name: Ensure netflix_app services are started and enabled (systemd or similar, if applicable)
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - docker
  ignore_errors: yes
  tags: netflix_app