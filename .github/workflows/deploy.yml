name: Deploy Netflix Clone Apps to EC2

on:
  workflow_dispatch:  
  workflow_run:
    workflows: ["Build and Push Docker images"]
    types:
      - completed
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    # Ensure this job only runs if the 'Build and Push' workflow was successful
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH Key for Ansible
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }} # Your EC2 SSH private key from GitHub Secrets

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible python3-pip
          pip3 install docker # Install docker Python library for Ansible's docker modules

      - name: Ensure correct permissions for inventory
        run: chmod 600 inventory.ini

      - name: Run Ansible Playbook to Deploy
        run: |
          ansible-playbook -i inventory.ini playbook.yml \
            --vault-password-file <(echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}")
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ECR_PUBLIC_TOKEN: ${{ secrets.AWS_ECR_PUBLIC_TOKEN }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
