name: Deploy Docker images to EC2 from ECR

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["docker-build-ecr.yml"]
    types:
      - completed

jobs:
  deploy-to-ec2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: SSH to EC2 and deploy Docker containers
        env:
          EC2_PUBLIC_IP: ${{ secrets.EC2_PUBLIC_IP }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          # Save the private key as a file
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          # SSH into the EC2 instance (use 'ubuntu' for Ubuntu instances)
          ssh -i private_key.pem -o StrictHostKeyChecking=no ubuntu@$EC2_PUBLIC_IP << 'EOF'
            # Check if AWS CLI is installed, install if not
            if ! command -v aws &> /dev/null
            then
                echo "AWS CLI not found. Installing..."
                sudo apt update
                sudo apt install -y awscli
            else
                echo "AWS CLI is already installed."
            fi

            # Check if Docker is installed, install if not
            if ! command -v docker &> /dev/null
            then
                echo "Docker not found. Installing..."
                sudo apt install -y docker.io
                # Start Docker service if newly installed
                sudo systemctl start docker
                sudo systemctl enable docker
            else
                echo "Docker is already installed."
            fi

            # Pull the latest Docker images from ECR
            aws ecr-public get-login-password --region $AWS_REGION | sudo docker login --username AWS --password-stdin public.ecr.aws/s5x3y1a8
            
            # Pull frontend image
            sudo docker pull public.ecr.aws/s5x3y1a8/netflix-clone/frontend:latest
            # Pull backend image
            sudo docker pull public.ecr.aws/s5x3y1a8/netflix-clone/backend:latest
            
            # Stop and remove the existing containers
            sudo docker stop netflix-frontend || true
            sudo docker rm netflix-frontend || true
            sudo docker stop netflix-backend || true
            sudo docker rm netflix-backend || true
            
            # Run the new containers with specific ports
            sudo docker run -d -p 9090:8080 --name netflix-backend public.ecr.aws/s5x3y1a8/netflix-clone/backend:latest
            sudo docker run -d -p 80:80 --name netflix-frontend public.ecr.aws/s5x3y1a8/netflix-clone/frontend:latest
          EOF
          rm private_key.pem
