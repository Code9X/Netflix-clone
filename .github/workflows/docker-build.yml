name: Auto Version and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Latest Tag and Set New Tag
        id: version
        run: |
          # Get list of tags from GHCR API
          latest_tag=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://ghcr.io/v2/code9x/netflix-backend/tags/list | jq -r '.tags[]' | grep '^v[0-9]\+' | sort -Vr | head -n 1)

          echo "Latest tag: $latest_tag"
          
          if [[ -z "$latest_tag" ]]; then
            new_tag="v1"
          else
            number=${latest_tag#v}
            new_tag="v$((number + 1))"
          fi

          echo "New tag: $new_tag"
          echo "tag=$new_tag" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build & Push Backend Image
        run: |
          docker build -t ghcr.io/code9x/netflix-backend:${{ steps.version.outputs.tag }} ./Netflix-Backend
          docker push ghcr.io/code9x/netflix-backend:${{ steps.version.outputs.tag }}

      - name: Build & Push Frontend Image
        run: |
          docker build -t ghcr.io/code9x/netflix-frontend:${{ steps.version.outputs.tag }} ./Netflix-Frontend
          docker push ghcr.io/code9x/netflix-frontend:${{ steps.version.outputs.tag }}
