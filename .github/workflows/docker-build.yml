name: Auto Version and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Get Latest Tag and Set New Tag
        id: version
        run: |
          echo "Fetching latest tag..."
          latest_tag=$(curl -s -H "Authorization: Bearer ${{ secrets.GHCR_PAT }}" \
            https://ghcr.io/v2/code9x/netflix-backend/tags/list | \
            jq -r '.tags[]' | grep '^v[0-9]\+$' | sort -Vr | head -n 1)

          if [[ -z "$latest_tag" ]]; then
            new_tag="v1"
          else
            number=${latest_tag#v}
            new_tag="v$((number + 1))"
          fi

          echo "Latest tag: $latest_tag"
          echo "New tag: $new_tag"
          echo "tag=$new_tag" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Copy appsettings template
        run: cp ./Netflix-Backend/appsettings.template.json ./Netflix-Backend/appsettings.json

      - name: Inject API Token into appsettings.json
        run: |
          sed -i "s|\"ApiToken\": \".*\"|\"ApiToken\": \"${{ secrets.API_TOKEN }}\"|" ./Netflix-Backend/appsettings.json

      - name: Build & Push Backend Image
        run: |
          docker build -t ghcr.io/code9x/netflix-backend:${{ steps.version.outputs.tag }} ./Netflix-Backend
          docker push ghcr.io/code9x/netflix-backend:${{ steps.version.outputs.tag }}

          docker tag ghcr.io/code9x/netflix-backend:${{ steps.version.outputs.tag }} ghcr.io/code9x/netflix-backend:latest
          docker push ghcr.io/code9x/netflix-backend:latest

      - name: Build & Push Frontend Image
        run: |
          docker build -t ghcr.io/code9x/netflix-frontend:${{ steps.version.outputs.tag }} ./Netflix-Frontend
          docker push ghcr.io/code9x/netflix-frontend:${{ steps.version.outputs.tag }}

          docker tag ghcr.io/code9x/netflix-frontend:${{ steps.version.outputs.tag }} ghcr.io/code9x/netflix-frontend:latest
          docker push ghcr.io/code9x/netflix-frontend:latest
