name: Build and Run Containers

on:
  push:
    branches:
      - main

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Backend Image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/netflix-backend:latest ./Netflix-Backend

      - name: Build Frontend Image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/netflix-frontend:latest ./Netflix-Frontend

      - name: Run Backend Container
        run: |
          docker run -d --name netflix-backend -p 9090:8080 ghcr.io/${{ github.repository_owner }}/netflix-backend:latest

      - name: Run Frontend Container
        run: |
          docker run -d --name netflix-frontend -p 5173:5173 ghcr.io/${{ github.repository_owner }}/netflix-frontend:latest
