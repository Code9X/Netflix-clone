name: Deploy to ECR Public

# Manual trigger
on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR Public
        run: |
          aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

      - name: Build and push Docker image (Frontend)
        run: |
          docker build -t public.ecr.aws/s5x3y1a8/netflix-clone/frontend ./frontend
          docker push public.ecr.aws/s5x3y1a8/netflix-clone/frontend

      - name: Build and push Docker image (Backend)
        run: |
          docker build -t public.ecr.aws/s5x3y1a8/netflix-clone/backend ./backend
          docker push public.ecr.aws/s5x3y1a8/netflix-clone/backend
