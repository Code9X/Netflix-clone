name: Build and Push Docker images to AWS ECR

# Manual trigger
on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr-public get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin public.ecr.aws/s5x3y1a8

      - name: Build and Push Frontend Docker Image
        run: |
          docker build -t public.ecr.aws/s5x3y1a8/netflix-clone/frontend ./Netflix-Frontend
          docker push public.ecr.aws/s5x3y1a8/netflix-clone/frontend

      - name: Build and Push Backend Docker Image
        run: |
          docker build -t public.ecr.aws/s5x3y1a8/netflix-clone/backend ./Netflix-Backend
          docker push public.ecr.aws/s5x3y1a8/netflix-clone/backend
