name: Push Docker Images to ECR

# Manual trigger
on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Authenticate to ECR Public
        uses: aws-actions/amazon-ecr-login@v1

      - name: Test ECR Authentication
        run: |
          aws ecr-public describe-repositories --region ${{ secrets.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Get Latest Tag and Set New Tag
        id: version
        run: |
          echo "Fetching latest tag..."
          latest_tag=$(aws ecr-public describe-images \
            --repository-name netflix-clone/backend \
            --region ${{ secrets.AWS_REGION }} \
            --query 'imageDetails[].imageTags[]' \
            --output text | grep '^v[0-9]\+$' | sort -Vr | head -n 1)

          if [[ -z "$latest_tag" ]]; then
            new_tag="v1"
          else
            number=${latest_tag#v}
            new_tag="v$((number + 1))"
          fi

          echo "Latest tag: $latest_tag"
          echo "New tag: $new_tag"
          echo "tag=$new_tag" >> $GITHUB_OUTPUT

      - name: Copy appsettings template
        run: cp ./Netflix-Backend/appsettings.template.json ./Netflix-Backend/appsettings.json

      - name: Inject API Token into appsettings.json
        run: |
          sed -i "s|\"ApiToken\": \".*\"|\"ApiToken\": \"${{ secrets.API_TOKEN }}\"|" ./Netflix-Backend/appsettings.json

      - name: Build & Push Backend Image
        run: |
          docker build -t public.ecr.aws/s5x3y1a8/netflix-clone/backend:${{ steps.version.outputs.tag }} ./Netflix-Backend
          docker push public.ecr.aws/s5x3y1a8/netflix-clone/backend:${{ steps.version.outputs.tag }}

          docker tag public.ecr.aws/s5x3y1a8/netflix-clone/backend:${{ steps.version.outputs.tag }} public.ecr.aws/s5x3y1a8/netflix-clone/backend:latest
          docker push public.ecr.aws/s5x3y1a8/netflix-clone/backend:latest

      - name: Build & Push Frontend Image
        run: |
          docker build -t public.ecr.aws/s5x3y1a8/netflix-clone/frontend:${{ steps.version.outputs.tag }} ./Netflix-Frontend
          docker push public.ecr.aws/s5x3y1a8/netflix-clone/frontend:${{ steps.version.outputs.tag }}

          docker tag public.ecr.aws/s5x3y1a8/netflix-clone/frontend:${{ steps.version.outputs.tag }} public.ecr.aws/s5x3y1a8/netflix-clone/frontend:latest
          docker push public.ecr.aws/s5x3y1a8/netflix-clone/frontend:latest
